# What shotgun looks for. Edit freely — every field is read at runtime.

# ---------------------------------------------------------------- target roles
# A job must match at least one `include` pattern (case-insensitive regex over
# the job title) and no `exclude` pattern. Keep these tight: the rule filter is
# what stops you paying Claude to score 4,000 irrelevant postings.
titles:
  include:
    # Staff-level individual contributor
    - '\bstaff\b.*\b(security|appsec|product security|infrastructure security)\b'
    - '\b(security|appsec)\b.*\bstaff\b'
    - '\bprincipal\b.*\bsecurity\b'
    - '\bsenior staff\b.*\bsecurity\b'
    # Lead security engineer
    - '\blead\b.*\bsecurity engineer\b'
    - '\bsecurity engineer\b.*\blead\b'
    - '\b(security|appsec|cloud security|product security)\b.*\b(tech lead|technical lead)\b'
    # Management
    - '\b(engineering manager|manager|head of|director)\b.*\b(security|appsec|product security)\b'
    - '\bsecurity\b.*\b(engineering manager|manager|head of|director)\b'
    # Senior and unlevelled security engineering.
    #
    # These were originally left out to keep the filter tight, but measured
    # against a 5,851-posting corpus the title rules were rejecting 99.1% and
    # the mobility gate only 0.5% — so this, not the visa filter, was the
    # reason only three roles ever reached the queue. Adding them surfaced 35
    # in-region roles including "Senior Cloud Security Engineer, Berlin" and
    # "Senior Cloud Security Engineer - AI Resilience, Remote Europe".
    #
    # A "Senior X Security Engineer" at a large company is frequently the same
    # scope as Staff elsewhere, and the scorer judges actual seniority from the
    # responsibilities anyway — that is what `level` is for.
    - '\b(senior|sr\.?)\b.*\b(security|appsec|infosec|product security|cloud security|application security|network security|infrastructure security|platform security)\b.*\bengineer\b'
    - '\b(security|appsec|infosec|product security|cloud security|application security|network security|infrastructure security|platform security)\b.*\bengineer\b'
    - '\bengineer\b.*\b(security|appsec|infosec|product security|cloud security|application security|network security|infrastructure security|platform security)\b'
    - '\b(security|appsec|product security|cloud security|application security)\b.*\b(architect|lead)\b'
  exclude:
    - '\b(intern|internship|graduate|new grad|apprentice|trainee)\b'
    - '\b(junior|jr\.?|associate|entry level)\b'
    - '\b(sales|account executive|account director|account manager|solutions engineer|pre-?sales|customer success)\b'
    - '\b(recruiter|talent|sourcer)\b'
    - '\b(soc analyst|tier 1|tier one|help ?desk|support engineer)\b'
    - '\b(physical security|guard|officer on site)\b'
    - '\bclearance required\b'
    # Non-engineering roles that otherwise slip past the level patterns —
    # "Principal Product Manager, Security" is not a staff IC role.
    - '\bproduct manager\b|\bproduct management\b|\bproduct owner\b'
    - '\b(technical program manager|program manager|tpm)\b'
    - '\b(partner manager|channel|alliances|business development)\b'
    - '\b(field engineer|sales engineer|solutions architect|technical account)\b'
    - '\b(product marketing|marketing manager|gtm)\b'
    - '\b(cleared|clearance)\b'
    - '\b(recruiting|people|hr) manager\b'
    # The noise the wider include patterns above let in. "Consulting Architect"
    # and "Solutions Architect" are pre-sales; "Specialist" in this corpus was
    # physical-security and channel roles; "Intermediate" is below level.
    - '\bconsulting architect\b'
    - '\bintermediate\b'
    - '\bsecurity (intelligence )?specialist\b'
    - '\b(research scientist|data scientist)\b'
    # Legal roles reached by the any-level `privacy` pattern below —
    # "Legal Counsel - Regulatory Compliance, Product and Privacy" is not a
    # security engineering job. Narrow on purpose: "Security & Compliance
    # Lead" is one, so `compliance` is not excluded.
    - '\b(legal counsel|counsel|paralegal|attorney)\b'

  # ------------------------------------------------- any level, any shape
  # A short list of companies where every security opening is worth seeing,
  # whatever the level and whatever the title looks like.
  #
  # Worth being precise about what this fixes, because it is not the level
  # gate. Measured against the roles these boards are actually advertising,
  # 31 of 43 already passed `include` — "Senior Web Security Engineer,
  # Browser Platform" among them. What `include` throws away is titles that
  # are security work but do not say "security <something> engineer":
  #
  #     Senior Privacy Engineer                     no include pattern
  #     Principal Security Researcher - EDR         no include pattern
  #     Detection Engineer                          no include pattern
  #     Senior Security Analyst (Governance)        no include pattern
  #     Staff Software Engineer - Detection Platform  no include pattern
  #
  # Across a 6,000-posting sweep requiring that shape is the right trade —
  # it is what keeps the scoring bill down. For a dozen companies you would
  # take a job at tomorrow it is the wrong trade, so for these the domain
  # alone is enough.
  #
  # `exclude` above still applies and is never relaxed. An internship is
  # still an internship, and "Product Manager - Security" is still a product
  # manager however much you want to work there.
  any_level:
    companies:
      # Genuinely location-neutral — these hire worldwide or close to it.
      - canonical         # "Home based - Worldwide" on every posting
      - duck-duck-go      # the Ashby board token
      - duckduckgo        # ...and the display spelling
      - mozilla
      # Remote-first with hiring into your regions.
      - chainguard
      - huntress
      - elevenlabs
      - goteleport
      - teleport
      - hackerone
      - proton
      - temporal
      - incident          # the Ashby token for incident.io
      - sonarsource
      - grafana
      - gitlab
      - clickhouse
      - posthog
      - supabase
      # Security-product companies. Security *is* the engineering here, so a
      # "Detection Engineer" or "Security Researcher" is core work rather
      # than an internal function — exactly the titles the shape rule drops.
      - zscaler
      - catonetworks
      - netskope
      - endorlabs
      - apiiro
      - obsidiansecurity
      - nudgesecurity
      - cyberhaven
      - sentra
      - doppel
      - twingate
      - netbird
      - cloudsek
      - immersivelabs
      - cribl
      - druva
      # Labs and companies already advertising security work in your regions.
      - anthropic
      - cohere
      - writer
      - snowflake
      - notion
      - staffbase
      - truveta
      - solarisbank
      - doctolib
      - teya
      - alan
      - miro
      # AI labs. These title security work in a house style the shape rule
      # cannot see: "Member of Technical Staff (Software Engineer, Security)",
      # "Member of Technical Staff - Security", "MTS, Security". Every one of
      # those matched no include pattern.
      - xai
      - perplexity
      - cognition
      - thinkingmachines
      - reflectionai
      - primeintellect
      - nousresearch
      - fireworks
      - etched
      - mercor
      - replit
      # AI-native and heavily-funded companies already hiring security in a
      # target region.
      - nebius            # 30 security roles, 6 across Amsterdam/Prague/Finland
      - intercom          # 4, all of them London or Dublin
      - wayve             # Staff Security Engineer, London
      - waymo             # 3 in London
      - vercel
      - algolia           # Information Security Engineer, remote UK
      - granola           # Security Engineer, London
      - coreweave
      # Companies whose in-region security roles the shape rule was dropping.
      # Each of these was found by `sweep`, which widens the titles, and then
      # rejected by `rank`, which did not — the two disagreeing is the bug.
      - openai            # Software Engineer, Privacy — Dublin and London;
                          # Applied AI Engineer, Cyber — Dublin
      - lovable           # Staff/Principal SWE, Detection and Response, Stockholm
      - expel             # Managed SIEM Detection Engineer, remote
      - cloudflare        # Senior Security Compliance Specialist
      - tide              # Engineer, Threat Detection — UK
      - celonis           # Manager of Global Cyber Defense, Madrid
      - gocardless        # Threat and Analytics Lead, Lisbon
      - databricks        # Principal Engineer - Privacy, Amsterdam
      - mindtickle        # Information Security & Privacy, Pune
      - veracode          # Senior Application Security Consultant, London
      - fastly            # Threat Detection Analyst, Australia-remote
      - elastic
    include:
      - '\b(security|appsec|infosec|cyber)\b'
      - '\b(privacy|cryptograph)\b'
      - '\b(detection|threat|vulnerabilit|bug bounty|red team|incident response)\b'

# The level buckets shotgun reports on. Used for tagging, not filtering.
levels:
  - staff
  - lead
  - manager

# ------------------------------------------------------------------- locations
# `regions` expand to country lists in shotgun/geo.py. A job passes if its
# country is in the expanded set, OR it is remote within one of these regions.
locations:
  regions:
    - india
    - europe        # EU/EEA + Switzerland
    - uk
    - australia
    - new_zealand
  # Extra individual countries beyond the regions above.
  countries: []
  # Accept fully-remote roles whose stated hiring region overlaps the above.
  accept_remote: true
  # Reject anything that requires relocation to a country outside the set,
  # even if the posting is otherwise a match.
  reject_other_countries: true
  # Countries outside `regions` that are still worth applying to *if* the
  # posting sponsors a visa, pays relocation, or is a contract you could work
  # from where you are. US roles are the main case.
  allow_if_mobility_friendly:
    - US
    - CA
    - SG
    - AE

# ------------------------------------------------------------ prioritisation
# "Apply to visa/relocation roles first" is implemented as a score bonus, so
# `shotgun prepare` spends its per-run budget on the roles that can actually
# result in a move. Tune the weights or zero them out.
priority:
  visa_sponsorship_bonus: 15
  relocation_bonus: 10
  contract_bonus: 8
  # Out-of-region roles with no mobility signal are penalised rather than
  # dropped — the location parse is not always right.
  no_mobility_penalty: 25
  explicit_no_sponsorship_penalty: 50

  # Companies worth reaching first, by group. These only reorder the queue —
  # nothing is filtered on company, so a name missing here still gets applied
  # to on its score alone.
  #
  # Matching is a word-boundary match against the posting's company name, so
  # `amazon` catches "Amazon Web Services (AWS)" and `meta` does not catch
  # "Metabase". A company in two groups earns the higher bonus, not the sum.
  #
  # Caveat worth knowing: a recruiting agency with a brand name that happens
  # to contain one of these words picks the bonus up too. It is a soft nudge
  # to the ordering, so that is tolerable rather than something to defend
  # against.
  company_groups:
    faang:
      bonus: 12
      companies:
        - meta
        - facebook
        - amazon
        - aws
        - apple
        - netflix
        - google
        - alphabet
        - youtube
        - deepmind
    # MANGO is used for a few different sets depending on who is saying it —
    # Meta or Microsoft for the M, and Nvidia or Netflix for the N. The union
    # is listed rather than picking one reading, because this only affects
    # ordering and being generous costs nothing.
    mango:
      bonus: 12
      companies:
        - meta
        - microsoft
        - apple
        - nvidia
        - google
        - openai
        - anthropic

  # Countries hiring hard enough right now to be worth reaching before the
  # rest of the in-region queue. Keyed by ISO code, matched against the
  # country parsed out of the posting's location — a role whose location is
  # only "Remote - Europe" names no country and so earns nothing here.
  country_bonus:
    GB: 8      # UK
    PL: 8      # Poland

# --------------------------------------------------------------- compensation
# Applied only when the posting states a salary. Postings with no salary
# published are never rejected on comp — most aren't.
compensation:
  # Placeholders — set your own. A posting is only rejected when it actually
  # publishes a number, and most do not.
  minimum:
    INR: 0
    EUR: 0
    GBP: 0
    AUD: 0
    NZD: 0
    USD: 0

# ------------------------------------------------------------------- scoring
scoring:
  # Jobs below this score (0-100) are never queued. Claude scores JD-vs-profile
  # relevance after the cheap rule filter has already run.
  minimum_score: 50
  # Hard skip list — if the JD mentions these, drop it regardless of score.
  # Matched as case-insensitive regexes, which is what lets an entry exclude
  # its own false positives. An invalid pattern is matched literally.
  dealbreakers:
    - 'active security clearance'
    # Not a bare 'polygraph'. Every US-incorporated employer pastes an
    # "Employee Polygraph Protection Act (EPPA)" poster link into the footer
    # of every posting — a law *forbidding* employers from demanding one —
    # and matching it rejected eight in-region Elastic security roles in
    # Spain, Portugal, Greece, Ireland, Poland and the UK.
    - '\bpolygraph\b(?!\s+protection)'
    - 'must be a us citizen'
    - 'onsite 5 days'

# --------------------------------------------------------------------- sources
sources:
  # Boards scraped via JobSpy.
  jobspy:
    enabled: true
    # Glassdoor is deliberately absent: it answers every non-US location with
    # "location not parsed" plus a connection reset, so it failed 100% of
    # queries here and only added latency. Each board is now scraped in its own
    # call, so re-adding it would cost time but no longer lose the other
    # boards' results for that query.
    boards: [linkedin, indeed, google]
    results_per_search: 50
    hours_old: 168        # one week
    # What to search for. This is the widest lever in the file — LinkedIn,
    # Indeed and Google index employers that run no public ATS at all, so
    # these queries are the only way this tool sees them.
    #
    # The defaults in jobspy_source.py were all level-prefixed — "staff
    # security engineer", "principal security engineer" — which quietly
    # decided that a role has to lead with its level to be found. It misses
    # "Senior Cloud Security Engineer", the exact title that scored 88 at
    # n26, and every AI-security title. Search by domain and let the title
    # rules and the scorer judge the level.
    #
    # Cost is terms x locations x boards, so this is 17 x 21 x 3 = 1,071
    # scrapes. That is hours, not minutes — LinkedIn rate-limits hard. Trim
    # either list to cut it; dropping the level-led terms alone halves it,
    # since the domain terms already match those titles.
    search_terms:
      # Domain, unlevelled — the broadest useful queries
      - security engineer
      - cloud security engineer
      - product security engineer
      - application security engineer
      - platform security engineer
      - infrastructure security engineer
      - devsecops engineer
      - security architect
      # The specialism that is hardest to find and least contested
      - ai security engineer
      - llm security
      - mcp security
      # Level-led, for roles that advertise that way
      - staff security engineer
      - principal security engineer
      - lead security engineer
      - security engineering manager
      - head of security
      - director of security
    # Locations per region. Poland and Ireland were missing entirely, which
    # is awkward given Poland carries a priority bonus.
    region_queries:
      india:
        - India
        - Bengaluru, India
        - Remote, India
      europe:
        - Germany
        - Berlin, Germany
        - Netherlands
        - Poland
        - Warsaw, Poland
        - Ireland
        - Dublin, Ireland
        - Spain
        - France
        - Sweden
        - Switzerland
        - Remote, Europe
        - Remote, EMEA
      uk:
        - London, United Kingdom
        - Remote, United Kingdom
      australia:
        - Sydney, Australia
        - Remote, Australia
      new_zealand:
        - Auckland, New Zealand
  # Public ATS job-board APIs. Add company tokens as you find them — these are
  # far higher signal than board scraping and have no anti-bot problem.
