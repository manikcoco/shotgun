  # Remote-first boards. All three verified live: Remotive and RemoteOK return
  # JSON, WeWorkRemotely returns RSS. Remotive is the most useful of them — it
  # publishes job_type (contract vs full_time) and the regions the employer
  # will actually hire into.
  remote_boards:
    enabled: true
    # arbeitnow is the only Germany/EU-weighted one of the four — the other
    # three are US-remote heavy, which is the gap it fills. Free, no key.
    boards: [remotive, remoteok, weworkremotely, arbeitnow]
  # remote.com has no public API — it is a React Server Components app, so
  # this adapter drives a headless browser and reads the DOM. Off by default
  # because it is the most fragile source here and costs a browser launch.
  remotecom:
    enabled: false
    search_terms:
      - security engineer
      - staff security
      - security manager

# -------------------------------------------------------------------- apply
apply:
  # queue    — fill the form, stop before submit, wait for `shotgun review`
  # auto     — submit without asking (see README: ToS risk)
  mode: queue
  # Never touch these even if a match shows up there.
  # Never discover, score, queue or apply to these. Matched on word
  # boundaries against the posting's company name, so "acme" also catches
  # "Acme GmbH" — which is the point, because the boards do not agree on how
  # a company spells itself.
  #
  # Your current employer belongs here. It cannot be left to the scorer: a
  # good role at your own company scores well, which is exactly why it has
  # to be excluded by rule.
  blocked_companies: []
  # Max applications to prepare per `shotgun run`. A safety valve.
  max_per_run: 10
