[project]
name = "shotgun"
version = "0.1.0"
description = "Find relevant senior security roles, tailor a resume per JD, fill the application, queue it for approval, and track it."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.3.0",
    "python-jobspy>=1.1.82",
    "playwright>=1.62.0",
    "typer>=0.27.2",
    "pydantic>=2.13.5",
    "jinja2>=3.1.6",
    "pdfplumber>=0.11.10",
    "python-docx>=1.2.0",
    "rich>=15.0.0",
    "pyyaml>=6.0.3",
    "httpx>=0.28",
    "truststore>=0.10.4",
    "fastapi>=0.120",
    "uvicorn>=0.38",
    "python-multipart>=0.0.20",
    "openai>=3.8.0",
]

[project.scripts]
shotgun = "shotgun.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shotgun"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
